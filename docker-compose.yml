services:
  gammaspec-dev:
    image: gammaspec/unified-dev:v2.0
    build:
      context: .
      dockerfile: DevOps/Dockerfile
    container_name: gammaspec-dev
    hostname: gammaspec-dev
    volumes:
      - ./:/workspace
    working_dir: /workspace
    ports:
      - "6080:6080"
      - "8888:8888"
    environment:
     # - VNC_RESOLUTION=3072x1920
      - VNC_COL_DEPTH=24
      - JUPYTER_PORT=8888
      - VNC_PORT=5901
      - NOVNC_PORT=6080
      - TZ=UTC
    stdin_open: true
    tty: true
    restart: unless-stopped