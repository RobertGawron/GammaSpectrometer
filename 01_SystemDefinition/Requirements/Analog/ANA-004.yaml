id: ANA-004
title: AFE Differential Small-Signal Bandwidth
category: Analog

description: >
  The analog front-end (AFE) small-signal differential transfer function,
  including the complete charge-sensitive amplifier (CSA) stage and ADC
  input load, shall exhibit a -3 dB bandwidth between 3 MHz and 6 MHz.

rationale: >
  From Detector Physics Analysis (Section 5):

  The MICROFC-60035-SMT SiPM exhibits a microcell recharge time constant
  of approximately 95 ns, which defines the dominant decay time of the
  detector pulse.

  This corresponds to an intrinsic signal bandwidth of approximately:

  f_signal approx 1 / (2 * pi * tau_cell) approx 1.7 MHz

  To accurately preserve pulse shape and energy information while limiting
  integrated noise, the AFE bandwidth shall exceed the signal bandwidth by
  a factor of approximately 2 to 3.

  This yields a required bandwidth range:

  f_3dB approx 3 MHz to 6 MHz

  This range ensures:
  - Accurate reconstruction of the pulse envelope with 40 MSPS sampling
  - Minimal distortion of pulse amplitude and area
  - Controlled noise bandwidth to meet the 0.43 percent RMS electronics budget

  The bandwidth requirement is independent of SiPM array size, as it is
  determined by the intrinsic microcell time constant and system-level
  sampling constraints.

assumptions:
  - MICROFC-60035-SMT SiPM (tau_cell approx 95 ns)
  - ADC sampling rate of 40 MSPS
  - Charge Sensitive Amplifier topology
  - Dominant first-order bandwidth behavior
  - White noise dominant in analog stage

acceptance_criteria:
  minus_3db_bandwidth_min_hz: 3e6
  minus_3db_bandwidth_max_hz: 6e6

verification_method:
  - Small-signal AC analysis (.ac sweep)
  - Differential transfer function measurement
  - -3 dB point measured relative to midband gain
  - Rise-time cross-check using small-signal transient step
  - Noise integration validation against 0.43 percent RMS requirement

