id: ANA-004
title: AFE Differential Small-Signal Bandwidth
category: Analog

description: >
  The analog front-end (AFE) small-signal differential transfer function,
  including the complete charge-sensitive amplifier (CSA) stage and ADC
  input load, shall exhibit a -3 dB bandwidth between 3 MHz and 6 MHz.

rationale: >
  From Detector Physics Analysis (Section 5):
  
  The MICROFC-60035-SMT SiPM has a microcell recharge time constant of
  approximately 95 ns. This defines the fundamental temporal character
  of the detector current pulse.
  
  With ADC sampling at 40 MSPS (25 ns period), stable digital reconstruction
  requires 3-5 samples across the rising edge of the pulse:
  
  Required rise time: t_rise = 3-5 x 25 ns = 75-125 ns
  
  Converting rise time to bandwidth:
  f_3dB = 0.35/t_rise
  
  For t_rise = 100 ns:
  f_3dB = 0.35/(100e-9) = 3.5 MHz
  
  The 3-6 MHz bandwidth range optimizes the tradeoff between:
  - Sufficient temporal resolution for pulse shape analysis
  - Limiting noise integration to meet 0.43% RMS noise target
  - Avoiding aliasing with 40 MSPS ADC sampling
  
  This bandwidth requirement is independent of SiPM array size, as it
  is determined by the fundamental microcell time constant and ADC
  sampling constraints.

assumptions:
  - MICROFC-60035-SMT SiPM (tau_cell = 95 ns)
  - ADC sampling rate of 40 MSPS
  - Charge Sensitive Amplifier topology
  - Dominant first-order bandwidth behavior
  - White noise dominant in analog stage

acceptance_criteria:
  minus_3db_bandwidth_min_hz: 3e6
  minus_3db_bandwidth_max_hz: 6e6

verification_method:
  - Small-signal AC analysis (.ac sweep)
  - Differential transfer function measurement
  - -3 dB point measured relative to midband gain
  - Rise-time cross-check using small-signal transient step
  - Noise integration validation against 0.43% RMS requirement

status: Draft
