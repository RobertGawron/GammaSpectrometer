id: ANA-002
title: AFE Linearity Requirement

category: Analog

description: >
  The analog front-end shall maintain integral non-linearity (INL) 
  better than 0.1% of full-scale and differential non-linearity (DNL)
  better than 0.05% over the complete operating range.

rationale: >
  From the detector physics analysis, the maximum allowable electronics 
  noise contribution is 0.43% RMS. Linearity is a critical component of 
  energy resolution in a gamma spectrometer.
  
  Non-linearity introduces systematic bias in energy measurements that 
  cannot be removed by increased integration time or averaging. For 
  precise gamma spectroscopy, the relationship between energy and pulse 
  height must be highly consistent across the entire spectrum.
  
  By limiting INL to 0.1%, we ensure that non-linearity remains a minor 
  contributor to overall resolution compared to the statistical 0.43% RMS 
  electronics noise budget.
  
  The DNL requirement of 0.05% ensures that peak shape distortion is 
  minimized, which is essential for accurate peak identification and 
  separation.
  
  These specifications are more appropriate for pulse processing systems 
  than THD, which is primarily relevant for sinusoidal signals.

assumptions:
  - Pulse-height linearity is critical for accurate energy calibration
  - Full energy range must fit within the linear region
  - Non-linearity directly impacts isotope identification accuracy
  - Measurements performed with precision pulse generator
  - Temperature range per system specification

acceptance_criteria:
  integral_nonlinearity_max: 0.1  # Percent of full scale
  differential_nonlinearity_max: 0.05  # Percent of full scale

verification_method:
  - Precision pulse height linearity measurement
  - Input swept from 0-100% of full scale in 5% increments
  - INL calculated as maximum deviation from best-fit line
  - DNL calculated as maximum deviation between adjacent step sizes

status: Draft
