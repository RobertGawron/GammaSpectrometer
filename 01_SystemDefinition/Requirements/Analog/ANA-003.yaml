id: ANA-003
title: AFE Output Swing and Linearity

category: Analog

description: >
  The analog front-end shall support at least 2.4 Vpp differential
  output swing without clipping or gain compression when operated
  over the full temperature range.
  
  The AFE shall maintain integral non-linearity (INL) better than 0.2%
  over the full output range up to 2.0 Vpp differential.

rationale: >
  The ADC differential full-scale input range is 2.0 Vpp.
  
  Based on the detector physics analysis, the maximum allowable
  electronics noise contribution is 0.43% RMS. To maintain this
  resolution across the full energy range, linearity must be
  preserved with sufficient margin.
  
  Selecting a 20% design margin for output swing:
  
  Required swing = 2.0 Vpp * 1.20 = 2.4 Vpp
  
  This increased margin accounts for:
  - Supply tolerance variation
  - Gain variation across temperature
  - Component tolerance across production lots
  - Output stage saturation effects
  - Aging and long-term drift
  
  The 0.2% INL specification ensures that non-linearity remains
  a minor contributor to overall resolution compared to the
  0.43% RMS electronics noise budget.

assumptions:
- ADC differential full-scale equals 2.0 Vpp
- Full energy range of interest must fit within linear region
- Gain error within specified tolerance
- Supply voltage within operating limits

acceptance_criteria:
  differential_output_swing_min: 2.4 # Vpp
  integral_nonlinearity_max: 0.2 # Percent of full scale

