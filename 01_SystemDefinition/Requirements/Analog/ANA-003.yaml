id: ANA-003
title: AFE Output Dynamic Range
category: Analog

description: >
  The analog front-end (AFE) shall support a minimum differential output
  swing of 2.4 Vpp without clipping or significant gain compression.

rationale: >
  The ADC full-scale differential input range is 2.0 Vpp. A design margin
  of 20% is required to accommodate gain variation, temperature effects,
  supply tolerance, and component variation without entering saturation.

  Providing headroom beyond the ADC full-scale ensures that the AFE
  remains within its linear operating region during nominal operation.

assumptions:
  - ADC differential full-scale input is 2.0 Vpp
  - Environmental and process variations affect gain and headroom

acceptance_criteria:
  differential_output_swing_min_vpp: 2.4
  gain_compression_max_percent: 1.0

verification_method:
  - Transient simulation with increasing input amplitude
  - Measure peak differential output voltage
  - Verify output swing ≥ 2.4 Vpp
  - Evaluate gain compression relative to linear region
  - Confirm absence of waveform clipping or saturation

status: Draft