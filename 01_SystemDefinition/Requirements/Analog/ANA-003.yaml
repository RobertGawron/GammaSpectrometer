id: ANA-003
title: AFE Output Dynamic Range
category: Analog

description: >
  The analog front-end (AFE) shall provide sufficient differential output
  headroom to ensure linear operation within the specified detector input
  current range, without clipping or excessive gain compression.

rationale: >
  The ADC differential full-scale input range is 2.0 Vpp (1.0 V peak).
  To prevent saturation due to gain variation, temperature drift,
  supply tolerance, and component variation, the AFE shall support
  a differential output swing greater than the ADC full-scale range.

  A minimum headroom margin of 20 percent above ADC full-scale
  is required to ensure that nominal full-scale operation does not
  approach analog saturation limits.

  Dynamic range margin is distinct from linearity (ANA-002).
  This requirement ensures that the AFE remains within its
  linear operating region under worst-case signal conditions.

assumptions:
  - ADC differential full-scale input range is 2.0 Vpp.
  - Maximum specified detector current is defined in system configuration.
  - Linearity is evaluated separately under ANA-002.

acceptance_criteria:
  differential_output_swing_min_vpp: 2.4
  adc_utilization_min_percent: 70
  adc_utilization_max_percent: 95
  gain_compression_max_percent: 1.0
  clipping_allowed: false

verification_method:
  - Perform transient simulation with increasing input current amplitude.
  - Measure differential peak output voltage.
  - Verify that maximum differential output swing is at least 2.4 Vpp.
  - Compute ADC utilization at maximum specified detector current:
      utilization_percent = (V_peak / V_fs_peak) * 100
    where V_fs_peak = 1.0 V.
  - Verify utilization is between 70 percent and 95 percent.
  - Evaluate gain compression by comparing slope near maximum
    specified detector current to slope in linear region.
  - Verify gain compression does not exceed 1.0 percent.
  - Confirm no waveform clipping occurs within the specified
    detector input current range.

status: Draft