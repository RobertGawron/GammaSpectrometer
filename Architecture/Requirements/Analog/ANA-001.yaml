id: ANA-001
title: AFE Differential Output Noise Limit

category: Analog

description: >
  The differential RMS noise at the ADC differential input pins,
  including the complete analog front-end and anti-alias filter,
  shall not exceed 400 uV RMS when integrated from DC to the
  Nyquist frequency (20 MHz) with the ADC operating at 40 MSPS.

rationale: >
  System ENOB target: 10.5 bits (SYS-001).
  ENOB = (SNR - 1.76) / 6.02.
  Required SNR = 6.02 * 10.5 + 1.76 = 64.97 dB approx 65 dB.
  For 2 Vpp differential full-scale:
    V_signal_rms = 2 Vpp / (2 * sqrt(2)) = 0.707 V.
  Maximum allowable RMS noise:
    V_noise_max = 0.707 / 10^(65/20)
                = 0.707 / 1778
                approx 0.000398 V
                approx 400 uV RMS.
  Limiting analog noise to this value ensures the complete
  system achieves >= 10.5 ENOB.

assumptions:
  - ADC intrinsic SNR per AD9238 datasheet approx 70 dB
  - Anti-alias filter included in simulation model
  - Differential noise evaluated at ADC input pins
  - Valid over full specified operating temperature range

acceptance_criteria:
  differential_output_noise_rms_max: 4.0e-4  # Volts RMS

status: Draft
last_verified_commit: null
