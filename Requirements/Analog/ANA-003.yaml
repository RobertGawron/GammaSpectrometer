id: ANA-003
title: AFE Output Swing Margin

category: Analog

description: >
  The analog front-end shall support at least 2.2 Vpp differential
  output swing without clipping or gain compression when operated
  over the full specified supply voltage and temperature range.

rationale: >
  The ADC differential full-scale input range is 2.0 Vpp.

  To prevent clipping or gain compression at full-scale input,
  the analog front-end must provide output swing margin beyond
  the nominal ADC full-scale range.

  Selecting a 10 percent design margin:

  Required swing = 2.0 Vpp * 1.10
                 = 2.2 Vpp

  This margin accounts for:
  - Supply tolerance variation
  - Temperature drift
  - Gain error
  - Component tolerance
  - Output stage saturation effects

  Ensuring additional swing margin guarantees that the ADC
  full-scale range is reachable without distortion or clipping
  introduced by the analog front-end.

assumptions:
- ADC differential full-scale equals 2.0 Vpp
- Gain error within specified tolerance
- Supply voltage within specified operating limits
- Temperature range per system specification

acceptance_criteria:
  differential_output_swing_min: 2.2 # Vpp

