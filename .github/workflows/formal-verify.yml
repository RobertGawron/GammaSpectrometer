name: Formal Verification

on:
  workflow_run:
    workflows: ["Build Docker"]
    types: [completed]
    branches: [main, "feature/*"]

jobs:
  formal-verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/docker-postbuild-generic.yml
    with:
      docker_image_repo: yourusername/gamma-spectrometer
      artifact_name: formal-verification-results
      artifact_paths: |
        reports/formal/
      run_script: |
        mkdir -p reports/formal
        echo "=== Running Formal Verification ==="
        
        # Run all .sby files
        for sby_file in formal/*.sby; do
          if [ -f "$sby_file" ]; then
            name=$(basename "$sby_file" .sby)
            echo "Verifying: $name"
            sby -f "$sby_file" 2>&1 | tee "reports/formal/${name}.log"
          fi
        done
        
        echo "Formal verification complete!"