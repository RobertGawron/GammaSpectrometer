name: formal-verify

on:
  workflow_run:
    workflows: ["docker-build"]
    types: [completed]
    branches: [main, "feature/*"]

jobs:
  formal:
    name: SymbiYosys Proofs
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/docker-postbuild-generic.yml
    with:
      service_name: gammaspec-dev
      working_directory: /workspace
      artifact_name: formal-verification-results
      artifact_paths: |
        05_Verification/DigitalLogic/Reports/Formal/
      run_script: |
        just -f ./04_Implementation/DigitalLogic/justfile formal