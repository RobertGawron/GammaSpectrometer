name: static-analysis

on:
  workflow_run:
    workflows: ["Build Docker"]
    types: [completed]
    branches: [main, "feature/*"]

jobs:
  static-analysis:
    name: VHDL Lint (Style + Analysis)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/docker-postbuild-generic.yml
    with:
      docker_image_repo: ${{ github.repository_owner }}/gammaspectrometer
      service_name: gammaspec-dev
      working_directory: /workspace/Software
      artifact_name: static-analysis-results
      artifact_paths: |
        Software/Build/Reports/Lint.log
      run_script: |
        mkdir -p Build/Reports
        just lint 2>&1 | tee Build/Reports/Lint.log