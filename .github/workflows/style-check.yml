name: Style Check

on:
  workflow_run:
    workflows: ["Build Docker"]
    types: [completed]
    branches: [main, "feature/*"]

jobs:
  style-check:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/docker-postbuild-generic.yml
    with:
      docker_image_repo: yourusername/gamma-spectrometer
      artifact_name: style-check-results
      artifact_paths: reports/style-check.txt
      run_script: |
        mkdir -p reports
        echo "=== VHDL Style Check (VSG) ===" | tee reports/style-check.txt
        vsg --configuration .vsgrc -f src/**/*.vhd 2>&1 | tee -a reports/style-check.txt
        echo "Style check complete!"