name: firmware-build

on:
  workflow_run:
    workflows: ["docker-build"]
    types: [completed]
    branches: [main, "feature/*"]

jobs:
  synthesize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/docker-postbuild-generic.yml
    with:
      service_name: gammaspec-dev
      working_directory: /workspace
      artifact_name: fpga-bitstream
      artifact_paths: |
        04_Implementation/DigitalLogic/Build/Top.bin
        04_Implementation/DigitalLogic/Build/Top.asc
        04_Implementation/DigitalLogic/Build/Top.json
      run_script: |
        just -f ./04_Implementation/DigitalLogic/justfile build