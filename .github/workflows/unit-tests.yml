name: unit-tests

on:
  workflow_run:
    workflows: ["docker-build"]
    types: [completed]
    branches: [main, "feature/*"]

jobs:
  unit-tests:
    name: VUnit Tests
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/docker-postbuild-generic.yml
    with:
      docker_image_repo: ${{ github.repository_owner }}/gammaspectrometer | tr '[:upper:]' '[:lower:]'
      service_name: gammaspec-dev
      working_directory: /workspace/Software
      artifact_name: unit-test-results
      artifact_paths: |
        Software/Build/Reports/UnitTests.xml
        Software/Build/Reports/UnitTests.log
      run_script: |
        just test-report