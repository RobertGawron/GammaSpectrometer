name: Unit Tests

on:
  workflow_run:
    workflows: ["Build Docker"]
    types: [completed]
    branches: [main, "feature/*"]

jobs:
  unit-tests:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/docker-postbuild-generic.yml
    with:
      docker_image_repo: yourusername/gamma-spectrometer
      artifact_name: unit-test-results
      artifact_paths: |
        reports/unit-tests.xml
        reports/unit-tests.html
      run_script: |
        mkdir -p reports
        echo "=== Running VUnit Tests ==="
        python3 tests/run.py \
          --xunit-xml reports/unit-tests.xml \
          --html reports/unit-tests.html \
          -v