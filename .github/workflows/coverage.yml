name: Code Coverage

on:
  workflow_run:
    workflows: ["Build Docker"]
    types: [completed]
    branches: [main, "feature/*"]

jobs:
  coverage:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/docker-postbuild-generic.yml
    with:
      docker_image_repo: yourusername/gamma-spectrometer
      artifact_name: coverage-report
      artifact_paths: |
        reports/coverage.html
        reports/coverage.xml
        reports/coverage-summary.txt
      run_script: |
        mkdir -p reports build
        echo "=== Generating Code Coverage ===" | tee reports/coverage-summary.txt
        
        # Compile with coverage
        cd build
        ghdl -a --std=08 --coverage ../src/*.vhd ../tests/tb_*.vhd
        ghdl -e --std=08 --coverage tb_top
        ghdl -r --std=08 --coverage tb_top
        
        # Generate reports
        cd ..
        gcovr --html-details reports/coverage.html
        gcovr --xml reports/coverage.xml
        gcovr --print-summary | tee -a reports/coverage-summary.txt