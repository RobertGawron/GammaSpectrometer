# --------------------------------------------
# Dark Count Noise Study
# --------------------------------------------

dark_count_study:

  rng_seed: 55

  detector:
    n_sipm: 4
    pe_per_kev_single: 0.59
    integration_time_s: 1.0e-6
    label: "4 x MICROFC-60035-SMT"

  energy_axis:
    e_max: 200.0
    n_bins: 800

  simulation:
    events_per_peak: 15000
    temperatures_c: [3, 21, 35]

  isotopes:
    - energy_kev: 5.9
      intensity: 1.0
      label: "Fe-55"

    - energy_kev: 13.5
      intensity: 0.7
      label: "Am-241"

    - energy_kev: 22.0
      intensity: 0.8
      label: "Cd-109"

    - energy_kev: 30.0
      intensity: 0.6
      label: "Ba-133"

    - energy_kev: 59.5
      intensity: 0.8
      label: "Am-241"