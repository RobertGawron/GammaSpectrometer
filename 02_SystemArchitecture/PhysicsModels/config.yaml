resolution_geometry_study:

    # --------------------------------------------
    # Physics Parameters
    # --------------------------------------------
    physics:
      energy_mev: 0.662       # Reference gamma energy (Cs-137)
      # For 6 x 6 mm (MICROFC‑60035‑SMT):
      # 
      # PDE = 31% typical at Vbr + 2.5 V
      # PDE = 41% typical at Vbr + 5.0 V
      # Source: Page 2, Table 1, Rev. 9 datasheet
      pde: 0.35
      optical_efficiency: 0.7
    
    # --------------------------------------------
    # Scintillator Properties
    # --------------------------------------------
    scintillators:
      NaI(Tl):
        light_yield_ph_per_mev: 38000
      LaBr3(Ce):
        light_yield_ph_per_mev: 63000
    
    geometry:
      crystal_diameters_mm: [25.4]
      sipm_sizes_mm: [3.0, 6.0, 12.0] # 12mm corresponds to 4 x 6 mm SiPM array



# --------------------------------------------
# SiPM Area Impact Study
# --------------------------------------------

sipm_array_spectrum_study:

    rng_seed: 55
    
    energy_axis:
      max_kev: 2000
      bins: 4096
    
    simulation:
      events_per_peak: 20000
      background_rate: 5
      seed: 42
    
    detector_model:
      fwhm_single_662: 0.12
    
    sipm_arrays:
      "1 x 6x6mm":
        n_sipm: 1
      "4 x 6x6mm":
        n_sipm: 4
      "6 x 6x6mm":
        n_sipm: 6
    # --------------------------------------------
    # Isotope Lines
    # --------------------------------------------
    # Format: energy_keV, relative_intensity
    # Sources: common calibration and environmental lines
    isotopes:
