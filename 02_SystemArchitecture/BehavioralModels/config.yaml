# ============================================
# SiPM Coverage Trade Study Configuration
# ============================================

study:
  description: >
    Trade study investigating the effect of SiPM array size
    on statistical energy resolution using SiPM-based detection.

# --------------------------------------------
# Physics Parameters
# --------------------------------------------
physics:
  energy_mev: 0.662       # Reference gamma energy (Cs-137)
  # For 6 × 6 mm (MICROFC‑60035‑SMT):
  # 
  # PDE = 31% typical at Vbr + 2.5 V
  # PDE = 41% typical at Vbr + 5.0 V
  # Source: Page 2, Table 1, Rev. 9 datasheet
  pde: 0.35
  optical_efficiency: 0.7

# --------------------------------------------
# Scintillator Properties
# --------------------------------------------
scintillators:
  NaI(Tl):
    light_yield_ph_per_mev: 38000
  LaBr3(Ce):
    light_yield_ph_per_mev: 63000

geometry:
  crystal_diameters_mm: [25.4, 38.0, 50.0]
  sipm_sizes_mm: [6.0, 10.0, 25.4]

# --------------------------------------------
# Energy Axis
# --------------------------------------------
energy_axis:
  max_kev: 2000
  bins: 4096

# --------------------------------------------
# Simulation
# --------------------------------------------
simulation:
  events_per_peak: 20000
  background_rate: 5
  seed: 42

# --------------------------------------------
# Detector Configuration
# --------------------------------------------
detector:
  # Single SiPM resolution at 662 keV (Cs-137)
  fwhm_single_662: 0.12

# --------------------------------------------
# SiPM Array Configurations
# --------------------------------------------
sipm_configurations:
  "1 x 6x6mm":
    n_sipm: 1
  "4 x 6x6mm":
    n_sipm: 4
  "6 x 6x6mm":
    n_sipm: 6

# --------------------------------------------
# Isotope Lines
# --------------------------------------------
# Format: energy_keV, relative_intensity
# Sources: common calibration and environmental lines
isotopes:
  - energy_kev: 59.5
    intensity: 0.6
    label: "Am-241"
