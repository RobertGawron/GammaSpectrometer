requirement:
  id: ANA-001
  source_file: ../../../../../01_SystemDefinition/Requirements/Analog/ANA-001.yaml

simulation:
  raw_file: ../03_RunArtifacts/raw/TbNoise.raw
  trace:
    frequency: "frequency"
    output_noise: "V(onoise)"

analysis:
  bandwidth:
    low_hz: 0
    high_hz: 20e6

  tia:
    feedback_resistor_ohm: 1e3

  additional_noise_sources:
    adc_input_vrms: 224e-6       # From ADC intrinsic SNR
    reference_vrms: 50e-6        # If applicable
    sipm_shot_vrms: 0

integration:
  method: trapezoidal
  assume_uncorrelated_noise: true

acceptance:
  differential_output_noise_rms_max: 3.3e-4
  comparison: "<="

report:
  generate_figures: true
  figure_formats:
    - svg
  include_noise_breakdown: true